# testexe — E2E test infrastructure: used by speedy-cli/tests/e2e_test.rs
# as a server/fixture process. Do not remove.
# Contains two binaries:
#   - testexe: manual E2E runner (build + index + query, requires Ollama)
#   - workspace-fixture: cross-process fixture used by
#       speedy-core/tests/workspace_cross_process.rs to test the file lock
[package]
name = "testexe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "testexe"
path = "src/main.rs"

[[bin]]
name = "workspace-fixture"
path = "src/workspace_fixture.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
speedy-core = { path = "../speedy-core" }

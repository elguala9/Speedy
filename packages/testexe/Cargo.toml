# testexe — infrastruttura di test E2E: usato da speedy-cli/tests/e2e_test.rs
# come server/fixture process. Non rimuovere.
# Contiene due binari:
#   - testexe: runner manuale E2E (build + index + query, richiede Ollama)
#   - workspace-fixture: fixture cross-process usato da
#       speedy-core/tests/workspace_cross_process.rs per testare il file lock
[package]
name = "testexe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "testexe"
path = "src/main.rs"

[[bin]]
name = "workspace-fixture"
path = "src/workspace_fixture.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
speedy-core = { path = "../speedy-core" }

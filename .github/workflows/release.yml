name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: ".exe"
          - target: x86_64-apple-darwin
            os: macos-latest
            suffix: ""
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgtk-3-dev libglib2.0-dev \
            libxdo-dev

      - name: Build all binaries (Linux/Windows — includes GUI)
        if: matrix.os != 'macos-latest'
        run: cargo build --release -p speedy-ai-context -p speedy-daemon -p speedy-cli -p speedy-ai-context-mcp -p speedy-gui -p speedy-language-context -p speedy-language-context-mcp --target ${{ matrix.target }}

      - name: Build all binaries (macOS — GUI excluded pending eframe/winit CI validation)
        if: matrix.os == 'macos-latest'
        run: cargo build --release -p speedy-ai-context -p speedy-daemon -p speedy-cli -p speedy-ai-context-mcp -p speedy-language-context -p speedy-language-context-mcp --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cp installer/README.txt target/${{ matrix.target }}/release/README.txt
          cp installer/INSTALLATION.md target/${{ matrix.target }}/release/INSTALLATION.md
          cp installer/FOR-IA.md target/${{ matrix.target }}/release/FOR-IA.md
          cd target/${{ matrix.target }}/release
          # Build the file list; speedy-gui is excluded from the macOS build
          # until eframe/winit CI validation passes.
          FILES=(
            speedy-ai-context${{ matrix.suffix }}
            speedy-daemon${{ matrix.suffix }}
            speedy-cli${{ matrix.suffix }}
            speedy-ai-context-mcp${{ matrix.suffix }}
            speedy-language-context${{ matrix.suffix }}
            speedy-language-context-mcp${{ matrix.suffix }}
            README.txt
            INSTALLATION.md
            FOR-IA.md
          )
          if [ -f "speedy-gui${{ matrix.suffix }}" ]; then
            FILES+=(speedy-gui${{ matrix.suffix }})
          fi
          tar czf speedy-${{ matrix.target }}.tar.gz "${FILES[@]}"
          mv speedy-${{ matrix.target }}.tar.gz ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: windows-binaries
          path: target/${{ matrix.target }}/release/speedy-*.exe

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: speedy-*.tar.gz
          generate_release_notes: false

  installer:
    name: Windows Installer
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist/

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -SkipBuild

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: dist/speedy-setup-*.exe

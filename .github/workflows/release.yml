name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            suffix: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            suffix: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgtk-3-dev libglib2.0-dev \
            libxdo-dev

      - name: Build all binaries
        run: cargo build --release -p speedy-ai-context -p speedy-daemon -p speedy-cli -p speedy-ai-context-mcp -p speedy-gui -p speedy-language-context --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf speedy-${{ matrix.target }}.tar.gz \
            speedy-ai-context${{ matrix.suffix }} \
            speedy-daemon${{ matrix.suffix }} \
            speedy-cli${{ matrix.suffix }} \
            speedy-ai-context-mcp${{ matrix.suffix }} \
            speedy-gui${{ matrix.suffix }} \
            speedy-language-context${{ matrix.suffix }}
          mv speedy-${{ matrix.target }}.tar.gz ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: windows-binaries
          path: target/${{ matrix.target }}/release/speedy-*.exe

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: speedy-*.tar.gz
          generate_release_notes: true

  installer:
    name: Windows Installer
    runs-on: windows-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist/

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -SkipBuild

      - name: Upload installer
        uses: softprops/action-gh-release@v2
        with:
          files: dist/speedy-setup-*.exe
